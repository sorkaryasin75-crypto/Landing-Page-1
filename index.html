<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Local Connections</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: { 50: '#f5f3ff', 500: '#8b5cf6', 600: '#7c3aed', 900: '#4c1d95' } }
                }
            }
        }
        
        // AI ENGINE: Feature Manifest (Source of Truth for Frontend capabilities)
        window.APP_FEATURE_MANIFEST = {
            version: "3.0.0",
            features: {
                hero: { version: "1.0", controls: ["headline", "subhead", "ctaText"] },
                offers: { version: "1.0", controls: ["title", "description", "url", "badge", "active", "targetCountries"] },
                ageGate: { version: "1.0", controls: ["enabled", "title", "text"] }
            }
        };
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #eef2ff, #f5f3ff, #fdf2f8); min-height: 100vh;}
        .glass { background: rgba(255,255,255,0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.5); }
        .spinner { border: 3px solid rgba(139,92,246,0.1); border-left-color: #7c3aed; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="antialiased text-gray-800 flex flex-col relative">

    <!-- Global Loader -->
    <div id="loader" class="fixed inset-0 bg-white/90 z-[100] flex items-center justify-center">
        <div class="flex flex-col items-center"><div class="spinner w-12 h-12 mb-4"></div><p class="font-medium text-brand-600">Loading connections...</p></div>
    </div>

    <!-- Age Gate -->
    <div id="age-gate" class="fixed inset-0 bg-gray-900/95 backdrop-blur-md z-[60] hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-8 max-w-md w-full text-center shadow-2xl">
            <i data-lucide="alert-triangle" class="w-12 h-12 text-red-500 mx-auto mb-4"></i>
            <h2 id="ag-title" class="text-3xl font-bold mb-2">18+ ONLY</h2>
            <p id="ag-text" class="text-gray-600 mb-8">You must be at least 18 years old to enter.</p>
            <div class="flex gap-3">
                <button onclick="window.location.href='https://google.com'" class="flex-1 py-3 rounded-xl border border-gray-200 text-gray-600 font-medium hover:bg-gray-50">EXIT</button>
                <button id="ag-enter" class="flex-1 py-3 rounded-xl bg-brand-600 text-white font-medium shadow-lg hover:bg-brand-500">I AM 18+</button>
            </div>
        </div>
    </div>

    <nav class="glass sticky top-0 z-40 px-6 py-4 flex justify-between items-center">
        <div class="font-bold text-xl text-brand-900 flex items-center gap-2"><i data-lucide="heart" class="text-brand-500"></i> <span id="site-title">DatingConnect</span></div>
    </nav>

    <main class="flex-1 flex flex-col items-center px-4 py-12 w-full max-w-2xl mx-auto">
        <div class="text-center mb-10 w-full">
            <h1 id="hero-headline" class="text-4xl md:text-5xl font-bold text-gray-900 mb-4 tracking-tight">Meet Local Singles</h1>
            <p id="hero-subhead" class="text-lg text-gray-600">Discover active members near <strong id="user-location" class="text-brand-600">you</strong>.</p>
        </div>
        <div id="offers-container" class="w-full space-y-4"></div>
    </main>

    <footer class="glass mt-auto py-8 text-center text-gray-500 text-sm">
        <p>&copy; <span id="year"></span> <span id="footer-title">DatingConnect</span>. 18+ Only.</p>
    </footer>

    <script type="module">
        import { FIREBASE_CONFIG } from './firebase-config.js';
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, get, push } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        let app, db, config, geoData = { country: 'US', city: 'your area' }, sessionId;

        async function init() {
            lucide.createIcons();
            document.getElementById('year').textContent = new Date().getFullYear();
            sessionId = sessionStorage.getItem('sid') || Math.random().toString(36).substring(2);
            sessionStorage.setItem('sid', sessionId);

            // Store tracking params
            const urlParams = new URLSearchParams(window.location.search);
            ['subid', 'cid', 'source', 'campaign'].forEach(p => {
                if (urlParams.has(p)) sessionStorage.setItem(`tk_${p}`, urlParams.get(p));
            });

            try {
                const geoReq = await fetch('https://ipapi.co/json/');
                geoData = await geoReq.json();
                document.getElementById('user-location').textContent = geoData.city || geoData.country_name || 'your area';
            } catch(e) { console.warn("Geo detection failed safely."); }

            try {
                app = initializeApp(FIREBASE_CONFIG);
                db = getDatabase(app);
                
                const snap = await get(ref(db, 'publishedConfig'));
                if (snap.exists()) {
                    config = snap.val();
                    applyConfig();
                    logAnalytics('page_view');
                } else {
                    showError("Platform configuration is currently empty.");
                }
            } catch (err) {
                console.error(err);
                showError("System unavailable. Please try again later.");
            }
            document.getElementById('loader').classList.add('hidden');
        }

        function applyConfig() {
            // Apply language/content (Fallback to default en)
            const lang = config.languages && config.languages[geoData.country_code] ? config.languages[geoData.country_code] : (config.site.defaultLang || 'en');
            
            document.title = config.site?.title || "DatingConnect";
            document.getElementById('site-title').textContent = config.site?.title || "DatingConnect";
            document.getElementById('footer-title').textContent = config.site?.title || "DatingConnect";
            
            if (config.hero) {
                document.getElementById('hero-headline').innerHTML = (config.hero.headline || "Meet Local Singles").replace('{city}', geoData.city);
                document.getElementById('hero-subhead').textContent = config.hero.subhead || "";
            }

            // Age Gate
            if (config.ageGate?.enabled && !localStorage.getItem('age_verified')) {
                document.getElementById('age-gate').classList.remove('hidden');
                document.getElementById('age-gate').classList.add('flex');
                document.getElementById('ag-enter').onclick = () => {
                    localStorage.setItem('age_verified', 'true');
                    document.getElementById('age-gate').classList.add('hidden');
                };
            }

            // Render Offers based on Geo Rules
            const container = document.getElementById('offers-container');
            container.innerHTML = '';
            
            const validOffers = Object.entries(config.offers || {}).filter(([_, o]) => {
                if (!o.active) return false;
                if (o.targetCountries && o.targetCountries !== 'ALL' && !o.targetCountries.includes(geoData.country_code)) return false;
                return true;
            });

            if (validOffers.length === 0) {
                container.innerHTML = `<div class="glass p-6 text-center text-gray-500 rounded-xl">No active offers for your region.</div>`;
                return;
            }

            validOffers.forEach(([id, offer]) => {
                const card = document.createElement('div');
                card.className = "glass p-6 rounded-2xl shadow-sm flex items-start gap-4 hover:shadow-md transition relative";
                const badge = offer.badge ? `<span class="absolute top-3 right-3 bg-brand-100 text-brand-700 text-xs font-bold px-2 py-1 rounded-full">${offer.badge}</span>` : '';
                
                card.innerHTML = `
                    ${badge}
                    <div class="w-12 h-12 rounded-full bg-brand-100 flex items-center justify-center shrink-0"><i data-lucide="zap" class="text-brand-600"></i></div>
                    <div class="flex-1 pr-12">
                        <h3 class="font-bold text-lg text-gray-900">${offer.title}</h3>
                        <p class="text-sm text-gray-600 mt-1 mb-4">${offer.description}</p>
                        <button data-offer-id="${id}" class="cta-btn w-full py-3 bg-brand-600 text-white rounded-xl font-medium shadow-lg hover:bg-brand-500 transition">${offer.ctaText || 'Continue'}</button>
                    </div>
                `;
                container.appendChild(card);
            });
            lucide.createIcons();
            
            // CTA Listener
            document.querySelectorAll('.cta-btn').forEach(btn => {
                btn.addEventListener('click', (e) => handleCTA(e.target.dataset.offerId));
            });
        }

        async function handleCTA(offerId) {
            const offer = config.offers[offerId];
            if (!offer || !offer.url) return;
            
            logAnalytics('cta_click', { offerId });
            
            let destUrl = new URL(offer.url);
            ['subid', 'cid', 'source', 'campaign'].forEach(p => {
                const val = sessionStorage.getItem(`tk_${p}`);
                if (val) destUrl.searchParams.set(p, val);
            });
            
            const btn = document.querySelector(`[data-offer-id="${offerId}"]`);
            btn.innerHTML = `<div class="spinner w-5 h-5 mx-auto border-white border-l-transparent"></div>`;
            
            setTimeout(() => window.location.href = destUrl.toString(), 300);
        }

        function logAnalytics(type, extra = {}) {
            try {
                push(ref(db, 'analytics/events'), {
                    type,
                    ts: Date.now(),
                    sessionId,
                    country: geoData.country_code || 'XX',
                    device: /Mobile|Android|iPhone/i.test(navigator.userAgent) ? 'Mobile' : 'Desktop',
                    ...extra
                });
            } catch(e) { /* non-blocking */ }
        }

        function showError(msg) {
            document.getElementById('offers-container').innerHTML = `<div class="p-6 bg-red-50 text-red-700 rounded-xl text-center">${msg}</div>`;
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
